amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "lunabot/base_link"
    global_frame_id: "map"
    odom_frame_id: "lunabot/odom"

    scan_topic: /scan

    max_beams: 60
    min_particles: 500
    max_particles: 2000

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    laser_model_type: "likelihood_field"
    laser_min_range: 0.2
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0

    update_min_d: 0.10
    update_min_a: 0.10

    tf_broadcast: true
    transform_tolerance: 1.0


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: lunabot/base_link
    odom_topic: /odometry/filtered


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.60
      max_vel_y: 0.0

      max_vel_theta: 0.80

      min_speed_xy: 0.0
      max_speed_xy: 0.60
      min_speed_theta: 0.0

      acc_lim_x: 0.80
      acc_lim_y: 0.0
      acc_lim_theta: 1.00

      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      critics:
        [
          "Oscillation",
          "BaseObstacle",
          "PathDist",
          "GoalDist"
        ]


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_frame: lunabot/odom
    global_frame: map
    robot_base_frame: lunabot/base_link

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: lunabot/odom
      robot_base_frame: lunabot/base_link

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.55

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 11.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: lunabot/base_link

      resolution: 0.05
      robot_radius: 0.55

      track_unknown_space: true

      plugins:
        ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 11.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 3.0


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/yogka/lunabot_ws/maps/lunar_habitat.yaml"


waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.60, 0.0, 0.80]
    min_velocity: [-0.20, 0.0, -0.80]

    max_accel: [0.80, 0.0, 1.00]
    max_decel: [-0.80, 0.0, -1.00]

    odom_topic: /odometry/filtered


collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true

    base_frame_id: "lunabot/base_link"
    odom_frame_id: "lunabot/odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true


docking_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    max_retries: 1

    base_frame: "lunabot/base_link"
    fixed_frame: "lunabot/odom"

    dock_plugins: ["simple_charging_dock"]

    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7

      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
